name: Update and Push Domainswild Files

on:
  schedule:
    # 避開整點:整點是 GitHub Actions 最擁擠的時段,排程容易延遲或被略過
    - cron: '17 */3 * * *'
  workflow_dispatch:

# 只開放 push commit 所需的最小權限
permissions:
  contents: write

# 排程與手動觸發不會同時執行,避免 push 衝突
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download and process domain files
        run: |
          set -euo pipefail

          BASE_URL="https://raw.githubusercontent.com/sjhgvr/oisd/main"

          for name in small big nsfw; do
            out="antiAD-set-${name}.txt"

            # -f:HTTP 錯誤(404/5xx)直接視為失敗,不會把錯誤頁面寫進檔案
            curl -fsSL --retry 3 --retry-delay 5 \
              -o "$out" "${BASE_URL}/domainswild_${name}.txt"

            # 內容為空也視為失敗,避免把空檔案 commit 上去
            if [ ! -s "$out" ]; then
              echo "::error::${out} 下載內容為空,中止更新"
              exit 1
            fi

            sed -i 's/\*\./\./g' "$out"
            echo "${out}: $(wc -l < "$out") lines"
          done

      - name: Merge anti-AD list into big list
        run: |
          set -euo pipefail

          ANTI_AD_URL="https://raw.githubusercontent.com/privacy-protection-tools/anti-ad/master/anti-ad-surge2.txt"
          ANTI_AD_FILE="${RUNNER_TEMP}/anti-ad-surge2.txt"
          MERGED_FILE="antiAD-set-merged.txt"   # 想直接覆蓋 big 的話,改成 antiAD-set-big.txt

          curl -fsSL --retry 3 --retry-delay 5 -o "$ANTI_AD_FILE" "$ANTI_AD_URL"
          if [ ! -s "$ANTI_AD_FILE" ]; then
            echo "::error::anti-AD 下載內容為空,中止更新"
            exit 1
          fi

          # 合併「已轉成 .domain 格式的 oisd big」與 anti-AD,去重後輸出
          python3 - antiAD-set-big.txt "$ANTI_AD_FILE" "$MERGED_FILE" <<'PY'
          import sys

          *sources, out = sys.argv[1:]

          # 行首 "." = 該網域及所有子網域(Surge DOMAIN-SET 語意);無 "." = 完全比對
          suffix, exact = set(), set()
          for path in sources:
              with open(path, encoding="utf-8-sig", errors="ignore") as f:
                  for line in f:
                      s = line.strip().lower()
                      if not s or s[0] in "#!;":      # 註解與空行
                          continue
                      if s.startswith("*."):          # 保險:殘留的 *.example.com
                          s = s[1:]
                      is_suffix = s.startswith(".")
                      d = s[1:] if is_suffix else s
                      if d:
                          (suffix if is_suffix else exact).add(d)

          def covered(d):
              """d 的任一上層網域(不含自己)已在 suffix 清單內?"""
              while "." in d:
                  d = d.split(".", 1)[1]
                  if d in suffix:
                      return True
              return False

          before = len(suffix) + len(exact)
          merged = [f".{d}" for d in suffix if not covered(d)]
          merged += [d for d in exact if d not in suffix and not covered(d)]
          merged.sort()

          if not merged:
              sys.exit("merge result is empty")

          with open(out, "w", encoding="utf-8", newline="\n") as f:
              f.write("#TITLE=antiAD-set-merged (oisd big + anti-AD)\n")
              f.write(f"#TOTAL_LINES={len(merged)}\n\n")
              f.write("\n".join(merged) + "\n")

          print(f"unique entries: {before}, after pruning: {len(merged)}")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add antiAD-set-*.txt

          # 沒有變更就不 commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update"
            git push
          fi
